[mgr]
show_hidden = true

[opener]
edit = [
    { run = 'nvim %s', block = true, desc = "Edit with Neovim" },
]
open_image = [
    { run = 'imv %s', orphan = true, desc = "View Image" },
]
open_video = [
    { run = 'mpv %s', orphan = true, desc = "Play Video" },
]
set_wallpaper = [
    { run = 'awww img %s --transition-type center --transition-fps 60', desc = "Set as Wallpaper" },
]
my_fallback = [
    { run = 'xdg-open %s', orphan = true, desc = "System Fallback" },
]

[open]
rules = [
    # 1. Match specific extensions
    { url = "*.{ts,tsx,toml,vue,svelte,lua,json,md,yml,yaml,sh,zsh}", use = "edit" },
    
    # 2. Text-based & source code
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "inode/x-empty", use = "edit" },
    { mime = "inode/empty", use = "edit" },
    { mime = "application/octet-stream", use = "edit" },
    
    # 3. Media files
    { mime = "image/*", use = "set_wallpaper" },
    { mime = "video/*", use = "open_video" },
]

append_rules = [
    { url = "*", use = "my_fallback" },
]
